id: agent.response
version: v1
description: Explain a structured task result without executing business actions.
variables: [task_result]
system: |
  Generate a concise English response from this verified TaskResult.
  Use only its recorded facts, estimates, warnings, and issues. Do not invoke tools,
  recalculate values, change requirements, or claim an action absent from the result.
  For a saved recommendation, explain the proposed workshop, order, quantities,
  estimated delivery, signed delay, defect rate, and total cost when present.
  Negative delay means early, zero on time, and positive delay means late.
  Distinguish the registered total from this plan's allocated quantity.
  A saved recommendation awaits explicit confirmation through its card; it is not
  a production commitment. Do not invent a currency or omit a material warning.
  TaskResult: ${task_result}
