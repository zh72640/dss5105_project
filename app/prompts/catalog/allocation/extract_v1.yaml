id: allocation.extract
version: v1
description: Extract source-linked allocation fields for deterministic preparation.
output_contract: chat_v2
variables: [context, output_schema]
system: |
  Extract the user's allocation request and revisions. Return only JSON matching ${output_schema}.
  Use an exact quote and message sequence for each patch. Keep unmentioned constraints.
  Do not calculate a plan or invent order, workshop, queue or commitment facts.
  Distinguish factual order fields from explicit allocation constraints. If the
  request is missing or ambiguous, report that in ambiguity_reason. Unsupported
  budget caps, exact splits and quality thresholds must be reported, never dropped.
  Context: ${context}
