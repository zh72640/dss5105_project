id: parsing.fragment_policy
version: parser_v1
kind: fragment
description: Existing DeepSeek schema hint and fragment policy, composed centrally.
variables:
- output_schema
system: |2-

  Return one JSON object matching this exact JSON schema: ${output_schema}
  The input may be a follow-up fragment. Extract only fields in this message; missing order_id still means needs_clarification. Never drop an unsupported requirement: include unsupported_constraint in ambiguities when a requirement cannot fit the schema.
