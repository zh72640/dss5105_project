
name: Clarification Detection Evaluation

on:
  push:
    branches:
      - tongling
      - ningtao
      - main
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run service and frontend tests
        run: |
          uv run --locked python -m unittest discover -s tests -p 'test_*.py' -q
          node --test tests/test_*.cjs

      - name: Run clarification evaluation
        run: |
          uv run --locked python run_clarification_eval.py --backend offline --layer intake

      - name: Save evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clarification-evaluation-results
          path: evaluation/results/clarification_detection/
          if-no-files-found: warn
