description = "Local, auditable subcontracting dispatch desk for DSS5105"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "google-genai==2.23.0",
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite==3.1.2",
    "uvicorn==0.54.0",
    "pyyaml==6.0.3",
    "langchain==1.4.5",
    "langchain-openai==1.7.1",
    "langchain-anthropic==1.7.6",
    "langchain-google-genai==4.4.2",
    "langchain-deepseek==1.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
